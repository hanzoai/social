# Hanzo CI/CD — social. All real config is here; .hanzo/workflows/cicd.yml is
# triggers and an import of hanzoai/ci.

test:
  # Frozen, so the gate resolves the same tree the Dockerfile does. The lockfile
  # ships, and a stale one fails here rather than silently building something
  # else.
  - name: install
    run: |
      set -e
      corepack enable
      pnpm install --frozen-lockfile

  - name: postiz
    run: node --test server/postiz.test.mjs server/http.test.mjs server/edge.test.mjs

  # Verbatim the build line the image runs, run before there is an image, so a
  # break arrives in a minute instead of after a full layer stack. `pnpm build`
  # is `tsc --noEmit` then `vite build`. A vite build that emits nothing still
  # exits 0, hence the file tests.
  - name: build
    run: |
      set -e
      pnpm build
      test -s dist/index.html
      test -d dist/assets

images:
  - name: social
    context: .
    dockerfile: Dockerfile
    repo: ghcr.io/hanzoai/social
    # No build_secrets, and none belong here. Every credential that names a
    # person is minted by hanzo.id at sign-in; every credential that names a
    # network is sealed in KMS and read only by the publisher, server-side.

# Two doors. social.hanzo.ai is the Postiz drop-in (/mcp, /api/mcp,
# /public/v1). /v1/social stays on api.hanzo.ai, which is what the frontend
# calls. The image above is the process that serves both: Postiz paths
# locally, and /v1 proxied to HANZO_API (default https://api.hanzo.ai).
#
# The site lane still publishes dist and, on every main publish, re-binds
# social.hanzo.ai to the static site. That bind is why POST
# https://social.hanzo.ai/mcp returns index.html. The hostname is the drop-in
# when this image owns the name and the static bind stops. Leave the site
# lane until that cutover: dropping it stops UI updates and still does not
# serve MCP.
#
# `build` runs ON THE PUBLISH JOB. The test gate also produces dist, but that
# is a different runner: the site step looks at THIS checkout, and without a
# build here it reports "dist is not a directory" after a green test. Same
# commands as the image, so the bytes the edge serves are the bytes the gate
# already compiled.
site:
  slug: social
  dir: dist
  on: [main]
  build: |
    set -e
    corepack enable
    pnpm install --frozen-lockfile
    pnpm build
    test -s dist/index.html
    test -d dist/assets
    # Attach social.hanzo.ai to this project. The deploy token is already in
    # this step; a SuperAdmin-vouched bind goes live immediately. Anything
    # else is printed (status, DNS records, or the refusal) and does not
    # fail the export — the upload still has to land.
    api="${HANZO_API:-https://api.hanzo.ai}"
    if [ -z "${HANZO_DEPLOY_TOKEN:-}" ]; then
      echo "::warning::HANZO_DEPLOY_TOKEN missing in site.build — cannot POST /v1/projects/social/domains"
    else
      out="${RUNNER_TEMP:-/tmp}/bind-ai.json"
      set +e
      code=$(curl -sS -o "$out" -w '%{http_code}' \
        -X POST "$api/v1/projects/social/domains" \
        -H "Authorization: Bearer $HANZO_DEPLOY_TOKEN" \
        -H 'Content-Type: application/json' \
        -d '{"domains":["social.hanzo.ai"]}')
      curl_rc=$?
      set -e
      echo "POST /v1/projects/social/domains social.hanzo.ai HTTP ${code:-000} curl=${curl_rc}"
      cat "$out" || true
    fi
